name: Release

# Push a release/<version> tag (for example release/0.1.0, or release/0.2.0-rc1 for a release
# candidate) to build every platform and publish a GitHub release.
# Notes come from the matching "## <version>" section in Releases.md.

on:
  push:
    tags:
      - 'release/*'

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      type: ${{ steps.v.outputs.type }}
    steps:
      - id: v
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#release/}"
          if [[ $VER =~ ^[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9]+$ ]]; then TYPE='Release Candidate'; else TYPE='Release'; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la ./dist

      - name: Create release notes
        run: |
          python3 .github/scripts/extract-release-notes.py "${{ needs.version.outputs.version }}" Releases.md > Notes.md
          cat Notes.md

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          PRERELEASE=''
          [[ "${{ needs.version.outputs.type }}" == 'Release Candidate' ]] && PRERELEASE='--prerelease'
          gh release create "${GITHUB_REF_NAME}" $PRERELEASE --notes-file Notes.md \
            -t "Ethos Remote Control - ${{ needs.version.outputs.type }} ${{ needs.version.outputs.version }}" \
            dist/*
